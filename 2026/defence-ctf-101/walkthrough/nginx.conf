server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Slides are edited right up to the session, so make the browser
    # revalidate on every load instead of showing a stale copy
    add_header Cache-Control "no-cache";

    # reveal.js fetches the section files as text
    default_type text/plain;

    location / {
        try_files $uri $uri/ =404;
    }
}
